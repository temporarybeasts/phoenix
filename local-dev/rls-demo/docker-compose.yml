services:
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    volumes:
      - rls_demo_database_data:/var/lib/postgresql/data
volumes:
  rls_demo_database_data:
    driver: local
